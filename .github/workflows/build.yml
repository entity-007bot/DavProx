name: DavProx Android Build

"on":
push:
branches:
- main
- master
workflow_dispatch:

permissions:
contents: read

jobs:
build:
name: Build DavProx APK
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v6

  - name: Set up Java
    uses: actions/setup-java@v5
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v5

  - name: Check project files
    run: |
      echo "Checking DavProx project..."
      ls -la
      test -f gradlew || {
        echo "ERROR: gradlew is missing from the repository root."
        exit 1
      }
      test -f app/build.gradle -o -f app/build.gradle.kts || {
        echo "ERROR: app Gradle build file is missing."
        exit 1
      }
      chmod +x gradlew

  - name: Build debug APK
    run: ./gradlew assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v6
    with:
      name: DavProx-APK
      path: app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
      retention-days: 14
