name: DavProx Android Build and Release

on:
push:
branches:
- main
- master
workflow_dispatch:
release:
types:
- published

permissions:
contents: write

concurrency:
group: davprox-${{ github.ref }}
cancel-in-progress: true

jobs:
build:
name: Build DavProx APK
runs-on: ubuntu-latest
timeout-minutes: 30

steps:
  - name: Checkout source code
    uses: actions/checkout@v6

  - name: Set up Java
    uses: actions/setup-java@v5
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v5

  - name: Verify project
    run: |
      if [ ! -f gradlew ]; then
        echo "Gradle wrapper not found in repository root"
        exit 1
      fi

      if [ ! -f app/build.gradle ] && [ ! -f app/build.gradle.kts ]; then
        echo "Android app module not found"
        exit 1
      fi

      chmod +x gradlew

  - name: Build debug APK
    run: ./gradlew assembleDebug

  - name: Verify and prepare APK
    run: |
      set -e
      APK=$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name "*.apk" -print -quit)

      if [ -z "$APK" ]; then
        echo "APK was not generated"
        exit 1
      fi

      mkdir -p release
      cp "$APK" release/DavProx-debug.apk
      sha256sum release/DavProx-debug.apk > release/SHA256SUMS.txt

  - name: Upload APK artifact
    uses: actions/upload-artifact@v6
    with:
      name: DavProx-Android-APK
      path: |
        release/DavProx-debug.apk
        release/SHA256SUMS.txt
      if-no-files-found: error
      retention-days: 14

  - name: Attach APK to GitHub Release
    if: github.event_name == 'release'
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    run: |
      gh release upload "$GITHUB_REF_NAME" \
        release/DavProx-debug.apk \
        release/SHA256SUMS.txt \
        --clobber
