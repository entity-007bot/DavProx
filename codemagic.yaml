# Codemagic configuration for DavProx
# Documentation: https://docs.codemagic.io/yaml-basic-configuration/yaml-getting-started/

workflows:
  android-workflow:
    name: DavProx Android Build
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      vars:
        PACKAGE_NAME: "com.entity007.davprox"
      java: 17
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
        - pattern: 'master'
          include: true
          source: true
    scripts:
      - name: Set up debug keystore
        script: |
          # Automatically restore debug.keystore from repository base64 if missing
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              echo "Restoring debug.keystore from debug.keystore.base64..."
              base64 -d debug.keystore.base64 > debug.keystore
            else
              echo "Generating standard Android debug keystore..."
              keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi
      - name: Set permissions for Gradle Wrapper
        script: |
          chmod +x gradlew
      - name: Build Android Debug APK
        script: |
          ./gradlew assembleDebug --no-daemon --stacktrace
    artifacts:
      - app/build/outputs/**/*.apk
      - app/build/outputs/**/mapping.txt
    publishing:
      email:
        recipients:
          - davidchukwuyem73@gmail.com
        notify:
          success: true
          failure: true
